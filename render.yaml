services:
  - type: web
    name: cana
    runtime: python
    plan: free
    region: oregon
    buildCommand: ./scripts/render_build.sh
    startCommand: ./start_render.sh
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: ARBITER_EMBED_URL
        value: https://api.arbiter.traut.ai/public/embed
      - key: PYTHON_VERSION
        value: 3.13.5
