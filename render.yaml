services:
  - type: web
    name: cana
    runtime: python
    plan: free
    region: oregon
    buildCommand: ./scripts/render_build.sh
    startCommand: python scripts/serve_cana.py --host 0.0.0.0 --port $PORT --embed-url "$ARBITER_EMBED_URL"
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: ARBITER_EMBED_URL
        value: https://creation-api.actualgeneralintelligence.com/v1/embed
      - key: PYTHON_VERSION
        value: 3.13.5
